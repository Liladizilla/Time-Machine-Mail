name: Desktop installers

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/desktop-v') || (github.event_name == 'push' && contains(github.event.head_commit.message, 'Prepare desktop release')) || github.event_name == 'workflow_dispatch'
    name: Build ${{ matrix.platform }} installer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            command: npm run desktop:dist
          - os: windows-latest
            platform: windows
            command: npm run desktop:dist:win
          - os: macos-latest
            platform: macos
            command: npm run desktop:dist:mac
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile for supported dependency versions
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build installer
        run: ${{ matrix.command }}
      - name: Verify packaged Linux runtime
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          appimage="$(find release -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null
          test -f squashfs-root/resources/app/server.js
          test -f squashfs-root/resources/app/node_modules/next/package.json
          node -e "require.resolve('next', { paths: [require('path').resolve('squashfs-root/resources/app')] }); console.log('Packaged Next.js runtime resolves successfully')"
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: time-machine-mail-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Attach installers to GitHub release
    if: needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/desktop-v') || (github.event_name == 'push' && contains(github.event.head_commit.message, 'Prepare desktop release')))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
      - name: Read package version
        id: version
        run: node -e "console.log('version=' + require('./package.json').version)" >> "$GITHUB_OUTPUT"
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: time-machine-mail-*
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || format('desktop-v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release/*
